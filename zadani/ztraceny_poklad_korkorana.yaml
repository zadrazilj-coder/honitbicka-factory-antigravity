tema: Ztracený poklad kapitána Korkorána
popis: >
  Hra se odehrává na Lipně, kde se jedná o výpravu na tajný ostrov, který není na žádné mapě.
  Průvodcem hráčů je komický a bláznivý papoušek Ara, který dává někdy zmatečné a nesmyslné úkoly.
  Cílem je najít skutečný poklad plný bonbónů, který slouží jako sladká odměna na samotném konci hry.
vek: 09-12
format_hracu: jednotlivci
prostredi:
  - les
  - potok
obtiznost: stredni
ton: humorný, pirátský, dobrodružný

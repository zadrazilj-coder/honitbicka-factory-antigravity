tema: Ztracený poklad kapitána Kormorána
popis: Děj se odehrává na malém rybníce, ve kterém žije moudrá štika Tika. Průvodcem
  je vtipný a zapomětlivý papoušek ARA, který dává náhodně správné a špatné odpovědi.
  Cílem je poznat, že štika Tika říká pravdu, papoušek je popleta. Poté až poznáme,
  že štika Tika říká pravdu, nás příbeh přenese na konec, ale dá se i náhodně najít
  cestu přes papouška. Ve hře se vyskytují ještě jiná zvířátka, zejména pro oklamání
  a zkrášlení hry.
postavy: Papoušek Ara (archetip kašpárek tj. zapomětlivý, srší vtipem, občas neříká
  pravdu), štika Tika (archetip moudrá sova nebo učitel, pravdomluvná, někdy těžko
  pochopitelná, moudrá a stará)
rekvizity: starý nefunkční kompas, hrnek bez ucha, jehla na šití a jedna bota bez
  tkaničky
cil_odmena: nalézt kostru ruky kapitána Kormorána, která drží skutečnou mapu s pokladem
vek: 06-09
format_hracu: jednotlivci
obtiznost: stredni
ton: humorný, akční, pirátský, dobrodružný
prostredi:
- les
- park
